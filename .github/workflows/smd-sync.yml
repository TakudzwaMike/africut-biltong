name: Sync Supplier Catalog

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Call Sync Endpoint
        run: |
          curl --fail -X GET ${{ secrets.SITE_URL }}/api/cron/sync-smd \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json"
